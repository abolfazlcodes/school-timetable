services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_panel
      POSTGRES_USER: school_panel
      POSTGRES_PASSWORD: school_panel
    ports:
      - "5432:5432"
    volumes:
      - school_panel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_panel -d school_panel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  school_panel_postgres:
